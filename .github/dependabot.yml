version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-framework:
        patterns:
          - next
          - '@next/eslint-plugin-next'
      routine-patches:
        patterns:
          - '*'
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action
          - github/codeql-action/*
      routine-patches:
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: terraform
    directories:
      - /infra/modules/edge-controls
      - /infra/modules/pages-environments
      - /infra/modules/preview-access
      - /infra/states/cloudflare-audit
      - /infra/states/cloudflare-preview
      - /infra/states/cloudflare-production
      - /infra/states/cloudflare-shared
      - /infra/states/github-governance
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        group-by: dependency-name
        patterns:
          - "*"
