name: Bootstrap contact D1 databases

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  bootstrap:
    name: bootstrap-contact-d1
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reuse or create the isolated contact quota databases
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";
          const apiToken = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const databaseNames = [
            "smart-portfolio-contact-rate-limit-production",
            "smart-portfolio-contact-rate-limit-preview"
          ];
          const uuidPattern = /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i;

          if (!/^[a-f0-9]{32}$/i.test(accountId) || apiToken.length < 20) {
            throw new Error("The Cloudflare account ID or API token is unavailable.");
          }

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`;
          const headers = {
            Authorization: `Bearer ${apiToken}`,
            "Content-Type": "application/json"
          };

          async function callCloudflare(url, init = {}) {
            const response = await fetch(url, { ...init, headers });
            const payload = await response.json().catch(() => null);

            if (!response.ok || payload?.success !== true) {
              const messages = Array.isArray(payload?.errors)
                ? payload.errors.map(({ message }) => message).filter(Boolean).join("; ")
                : "No provider detail was returned.";
              throw new Error(`Cloudflare D1 request failed with ${response.status}: ${messages}`);
            }

            return payload.result;
          }

          async function findExactDatabase(name) {
            const url = new URL(endpoint);
            url.searchParams.set("name", name);
            url.searchParams.set("page", "1");
            url.searchParams.set("per_page", "100");
            const databases = await callCloudflare(url);
            const matches = Array.isArray(databases)
              ? databases.filter((database) => database?.name === name)
              : [];

            if (matches.length > 1) {
              throw new Error(`Cloudflare returned duplicate exact matches for ${name}.`);
            }

            return matches[0] ?? null;
          }

          async function resolveDatabase(name) {
            const existing = await findExactDatabase(name);
            if (existing) {
              return existing;
            }

            try {
              return await callCloudflare(endpoint, {
                method: "POST",
                body: JSON.stringify({ name, primary_location_hint: "wnam" })
              });
            } catch (creationError) {
              const concurrent = await findExactDatabase(name);
              if (concurrent) {
                return concurrent;
              }
              throw creationError;
            }
          }

          const resolved = [];
          for (const name of databaseNames) {
            const database = await resolveDatabase(name);
            if (database?.name !== name || !uuidPattern.test(database?.uuid ?? "")) {
              throw new Error(`Cloudflare returned an invalid database record for ${name}.`);
            }
            resolved.push(database);
          }

          if (resolved[0].uuid === resolved[1].uuid) {
            throw new Error("Production and preview resolved to the same D1 database.");
          }

          console.log(`D1_PRODUCTION_DATABASE_ID=${resolved[0].uuid}`);
          console.log(`D1_PREVIEW_DATABASE_ID=${resolved[1].uuid}`);
          NODE
