            "$RUNNER_TEMP/smart-portfolio-tools/opa/opa"
      - name: Record independent source-validation evidence
        id: evidence
        run: node scripts/ci/run.mjs source-receipt
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
    env: *a5
  codeql:
    name: codeql
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the immutable candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Initialize CodeQL security-extended analysis
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
