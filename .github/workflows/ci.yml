      - resolve-candidate
      - prepare-content
      - build-and-package
      - verify
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.verify.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: cloudflare-${{ needs['prepare-content'].outputs.target }}
