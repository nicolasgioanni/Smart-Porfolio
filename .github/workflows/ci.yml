          set -euo pipefail
          mapfile -t sarif_files < <(find "$SARIF_OUTPUT" -maxdepth 1 -type f -name '*.sarif' -print | sort)
          if [[ "${#sarif_files[@]}" != 1 ]]; then
            echo "CodeQL SARIF validation failed without publishing scanner details."
            exit 1
          fi
          node scripts/security/checkSarif.mjs "${sarif_files[0]}"
      - name: Upload passed CodeQL SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:javascript-typescript
      - name: Record independent source-validation evidence
        id: evidence
        run: node scripts/ci/run.mjs source-receipt
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
