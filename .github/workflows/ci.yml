    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      accepted: ${{ steps.gate.outputs.accepted }}
      deploy: ${{ steps.gate.outputs.deploy }}
      acceptance: ${{ steps.gate.outputs.acceptance }}
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Evaluate all required results and exact producer evidence
        id: gate
        run: node scripts/ci/run.mjs verify
        env:
          CI_CANDIDATE: ${{ needs['resolve-candidate'].outputs.candidate }}
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: Report sanitized timing observations independently of acceptance
        if: always()
        continue-on-error: true
        run: node scripts/ci/metrics.mjs
        env:
          CI_CANDIDATE: ${{ needs['resolve-candidate'].outputs.candidate }}
