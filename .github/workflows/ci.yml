name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Run the green-gated deployment even when deployed content is unchanged
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  candidate-admission:
    name: candidate-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.admission.outputs.candidate_sha }}
    steps:
      - name: Reject ineligible events and untrusted workflow references before checkout
        id: admission
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "nicolasgioanni/Smart-Porfolio" ]] || { echo "Unsupported repository."; exit 1; }
          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate SHA is invalid."; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Workflow SHA is invalid."; exit 1; }
          expected_workflow_ref="$REPOSITORY/.github/workflows/ci.yml@$EVENT_REF"
          [[ "$WORKFLOW_REF" == "$expected_workflow_ref" ]] || { echo "Workflow reference does not match the eligible event ref."; exit 1; }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$EVENT_BASE_REF" == "main" || "$EVENT_BASE_REF" == "develop" ]] || { echo "Pull requests must target main or develop."; exit 1; }
              [[ "$EVENT_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]] || { echo "Pull request candidate ref is invalid."; exit 1; }
              ;;
            push)
              [[ "$EVENT_REF" == "refs/heads/main" || "$EVENT_REF" == "refs/heads/develop" ]] || { echo "Pushes must target main or develop."; exit 1; }
              [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Trusted workflow revision does not match the candidate."; exit 1; }
              ;;
            schedule|workflow_dispatch)
              [[ "$EVENT_REF" == "refs/heads/main" ]] || { echo "Scheduled and manual candidates must use main."; exit 1; }
              [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Trusted workflow revision does not match the candidate."; exit 1; }
              ;;
            *)
              echo "Unsupported CI event."
              exit 1
              ;;
          esac
          echo "candidate_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

  candidate-precheck:
    name: candidate-precheck
    needs: candidate-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      is_latest: ${{ steps.candidate.outputs.is_latest }}
    steps:
      - name: Check out the selected immutable candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate-admission.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and check the candidate revision before protected inputs
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "candidate_branch=" >> "$GITHUB_OUTPUT"
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            candidate_branch="$GITHUB_REF_NAME"
          else
            candidate_branch="main"
          fi

          git fetch --no-tags origin "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          latest_sha="$(git rev-parse "refs/remotes/origin/$candidate_branch")"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"

          if [[ "$latest_sha" == "$candidate_sha" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping protected inputs for stale $candidate_branch revision $candidate_sha."
          fi

  application-validation:
    name: application-validation
    needs: candidate-precheck
    runs-on: ubuntu-24.04
    outputs:
      candidate_branch: ${{ needs.candidate-precheck.outputs.candidate_branch }}
      candidate_sha: ${{ needs.candidate-precheck.outputs.candidate_sha }}
      content_hash: ${{ steps.content.outputs.content_hash }}
      deploy_target: ${{ steps.decision.outputs.deploy_target }}
      pages_domain: ${{ steps.pages.outputs.pages_domain }}
      pages_project_name: ${{ steps.pages.outputs.pages_project_name }}
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
      verification_tier: ${{ steps.decision.outputs.verification_tier }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate validated local template content for pull requests
        if: github.event_name == 'pull_request'
        env:
          PORTFOLIO_REQUIRE_REMOTE_CONTENT: "false"
          PORTFOLIO_WORKBOOK_URL: ""
        run: npm run generate:content

      - name: Validate the immutable Cloudflare Pages target
        id: pages
        if: github.event_name != 'pull_request' && needs.candidate-precheck.outputs.is_latest == 'true'
        env:
          CLOUDFLARE_PAGES_DOMAIN: ${{ vars.CLOUDFLARE_PAGES_DOMAIN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLOUDFLARE_PAGES_PROJECT_NAME" != "smart-portfolio" ]]; then
            echo "CLOUDFLARE_PAGES_PROJECT_NAME must be smart-portfolio."
            exit 1
          fi
          if [[ "$CLOUDFLARE_PAGES_DOMAIN" != "smart-portfolio-bds.pages.dev" ]]; then
            echo "CLOUDFLARE_PAGES_DOMAIN must match the reviewed Cloudflare-assigned domain."
            exit 1
          fi
          node scripts/checkDeployedContent.mjs url "$CLOUDFLARE_PAGES_DOMAIN" main > /dev/null
          node scripts/checkDeployedContent.mjs url "$CLOUDFLARE_PAGES_DOMAIN" develop > /dev/null
          echo "pages_domain=$CLOUDFLARE_PAGES_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "pages_project_name=$CLOUDFLARE_PAGES_PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch and generate the strict public workbook snapshot
        if: github.event_name != 'pull_request' && needs.candidate-precheck.outputs.is_latest == 'true'
        env:
          PORTFOLIO_WORKBOOK_URL: ${{ secrets.PORTFOLIO_WORKBOOK_URL }}
          PORTFOLIO_REQUIRE_REMOTE_CONTENT: "true"
        run: npm run generate:content

      - name: Read the validated workbook content hash
        id: content
        if: github.event_name != 'pull_request' && needs.candidate-precheck.outputs.is_latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          content_hash="$(node -p "require('./src/content/generated/portfolio.generated.json').metadata.contentHash")"
          if [[ ! "$content_hash" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Generated content is missing a valid SHA-256 contentHash."
            exit 1
          fi
          echo "content_hash=$content_hash" >> "$GITHUB_OUTPUT"

      - name: Compare the validated snapshot with production
        id: deployed_content
        if: >-
          needs.candidate-precheck.outputs.is_latest == 'true' &&
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_deploy == false))
        env:
          CLOUDFLARE_PAGES_DOMAIN: ${{ steps.pages.outputs.pages_domain }}
          CONTENT_HASH: ${{ steps.content.outputs.content_hash }}
          CANDIDATE_SHA: ${{ needs.candidate-precheck.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          production_url="$(node scripts/checkDeployedContent.mjs url "$CLOUDFLARE_PAGES_DOMAIN" main)"
          node scripts/checkDeployedContent.mjs compare \
            "$production_url" \
            "$CONTENT_HASH" \
            "$CANDIDATE_SHA" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_SHA}"

      - name: Decide verification tier and deployment
        id: decision
        shell: bash
        env:
          CANDIDATE_IS_LATEST: ${{ needs.candidate-precheck.outputs.is_latest }}
          DEPLOYED_CONTENT_MATCHES: ${{ steps.deployed_content.outputs.deployed_content_matches }}
          DEPLOYED_COMMIT_MATCHES: ${{ steps.deployed_content.outputs.deployed_commit_matches }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          should_verify=false
          should_deploy=false
          deploy_target="none"
          verification_tier="none"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            should_verify=true
            verification_tier="priority"
          elif [[ "${CANDIDATE_IS_LATEST:-false}" != "true" ]]; then
            echo "The candidate is stale; no verification artifact or deployment will be produced."
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            should_verify=true
            should_deploy=true
            deploy_target="production"
            verification_tier="full"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/develop" ]]; then
            should_verify=true
            should_deploy=true
            deploy_target="preview"
            verification_tier="full"
          else
            deploy_target="production"
            if [[ "${FORCE_DEPLOY:-false}" == "true" ||
                  "${DEPLOYED_CONTENT_MATCHES:-false}" != "true" ||
                  "${DEPLOYED_COMMIT_MATCHES:-false}" != "true" ]]; then
              should_verify=true
              should_deploy=true
              verification_tier="full"
            fi
          fi

          echo "should_verify=$should_verify" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$deploy_target" >> "$GITHUB_OUTPUT"
          echo "verification_tier=$verification_tier" >> "$GITHUB_OUTPUT"

      - name: Documentation integrity
        if: steps.decision.outputs.should_verify == 'true'
        run: npm run docs:check

      - name: Lint
        if: steps.decision.outputs.should_verify == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.decision.outputs.should_verify == 'true'
        run: npm run typecheck

      - name: Priority unit and contract tests
        if: steps.decision.outputs.verification_tier == 'priority'
        run: npm run test:priority

      - name: Full unit and integration suite
        if: steps.decision.outputs.verification_tier == 'full'
        run: npm run test

      - name: Install Chromium for browser regressions
        if: steps.decision.outputs.should_verify == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Priority browser regression suite
        if: steps.decision.outputs.verification_tier == 'priority'
        run: npm run test:e2e:priority

      - name: Linux skeleton visual regression
        if: steps.decision.outputs.verification_tier == 'priority'
        run: npm run test:e2e:skeletons:visual

      - name: Full browser regression suite
        if: steps.decision.outputs.verification_tier == 'full'
        run: npm run test:e2e:full

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the pull-request snapshot without remote credentials
        if: steps.decision.outputs.should_verify == 'true' && steps.decision.outputs.deploy_target == 'none'
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ needs.candidate-precheck.outputs.candidate_sha }}
        run: npm run build:generated

      - name: Build the exact production snapshot
        if: steps.decision.outputs.should_verify == 'true' && steps.decision.outputs.deploy_target == 'production'
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build:generated

      - name: Build the exact develop preview snapshot
        if: steps.decision.outputs.should_verify == 'true' && steps.decision.outputs.deploy_target == 'preview'
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY }}
        run: npm run build:generated

      - name: Create and verify the artifact integrity manifest
        if: steps.decision.outputs.should_deploy == 'true'
        env:
          CANDIDATE_SHA: ${{ needs.candidate-precheck.outputs.candidate_sha }}
        run: |
          node scripts/artifactIntegrity.mjs create out
          node scripts/artifactIntegrity.mjs verify out "$CANDIDATE_SHA"

      - name: Upload the exact verified static export
        if: steps.decision.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-pages-build
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  security-tools:
    name: security-tools
    needs: candidate-precheck
    if: needs.candidate-precheck.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the immutable candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/smart-portfolio-tools"
          mkdir -p "$tool_root"
          node scripts/security/installPinnedTool.mjs actionlint "$tool_root" > /dev/null

      - name: Validate tracked GitHub Actions workflows without publishing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          report_root="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          if ! "$RUNNER_TEMP/smart-portfolio-tools/actionlint/actionlint" \
            -shellcheck '' \
            -pyflakes '' > "$report_root/stdout" 2> "$report_root/stderr"; then
            echo "GitHub Actions syntax validation failed without publishing diagnostics."
            exit 1
          fi

  security-scans:
    name: security-scans
    needs: candidate-precheck
    if: needs.candidate-precheck.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete immutable history without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install checksum-verified credential-free scanners
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/smart-portfolio-tools"
          mkdir -p "$tool_root"
          node scripts/security/installPinnedTool.mjs gitleaks "$tool_root" > /dev/null
          node scripts/security/installPinnedTool.mjs zizmor "$tool_root" > /dev/null

      - name: Scan Git history and workflow semantics without publishing scanner details
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security/securityScans.mjs \
            --gitleaks "$RUNNER_TEMP/smart-portfolio-tools/gitleaks/gitleaks" \
            --gitleaks-mode git \
            --target . \
            --zizmor "$RUNNER_TEMP/smart-portfolio-tools/zizmor/zizmor"

      - name: Audit locked dependencies independently of application content
        run: npm run audit:check

  codeql:
    name: codeql
    needs: candidate-precheck
    if: needs.candidate-precheck.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the immutable candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize CodeQL security-extended analysis
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze CodeQL SARIF without upload
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
          output: sarif-results
          upload: never

      - name: Fail closed for malformed SARIF, scanner errors, or security findings
        shell: bash
        env:
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          mapfile -t sarif_files < <(find "$SARIF_OUTPUT" -maxdepth 1 -type f -name '*.sarif' -print | sort)
          if [[ "${#sarif_files[@]}" != 1 ]]; then
            echo "CodeQL SARIF validation failed without publishing scanner details."
            exit 1
          fi
          node scripts/security/checkSarif.mjs "${sarif_files[0]}"

      - name: Upload passed CodeQL SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:javascript-typescript

  dependency-review:
    name: dependency-review
    needs: candidate-precheck
    if: github.event_name == 'pull_request' && needs.candidate-precheck.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Block newly introduced high-severity dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  verify:
    name: verify
    if: always()
    needs: [candidate-admission, candidate-precheck, application-validation, security-tools, security-scans, codeql, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_branch: ${{ needs.application-validation.outputs.candidate_branch }}
      candidate_sha: ${{ needs.application-validation.outputs.candidate_sha }}
      content_hash: ${{ needs.application-validation.outputs.content_hash }}
      deploy_target: ${{ needs.application-validation.outputs.deploy_target }}
      pages_domain: ${{ needs.application-validation.outputs.pages_domain }}
      pages_project_name: ${{ needs.application-validation.outputs.pages_project_name }}
      should_deploy: ${{ needs.application-validation.outputs.should_deploy }}
      verification_tier: ${{ needs.application-validation.outputs.verification_tier }}
    steps:
      - name: Check out the immutable candidate for the CI gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.candidate-precheck.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Require successful application validation and every applicable security gate
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/security/ciGate.mjs --event "$CI_EVENT_NAME" --results "$CI_GATE_RESULTS"

  deploy:
    name: deploy-${{ needs.verify.outputs.deploy_target }}
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-${{ needs.verify.outputs.deploy_target }}
      cancel-in-progress: true
    steps:
      - name: Check out the exact verified candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.verify.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install the locked local deployment tool
        run: npm ci

      - name: Download the immutable verified export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-pages-build
          path: out

      - name: Validate every downloaded artifact file
        env:
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
        run: node scripts/artifactIntegrity.mjs verify out "$CANDIDATE_SHA"

      - name: Recheck the deployment branch immediately before Wrangler
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ needs.verify.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
          latest_sha="$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH")"
          if [[ "$latest_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Refusing to deploy stale $CANDIDATE_BRANCH revision $CANDIDATE_SHA; the branch is now $latest_sha."
            exit 1
          fi

      - name: Validate the environment-specific D1 binding and apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TARGET: ${{ needs.verify.outputs.deploy_target }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const placeholderId = "00000000-0000-0000-0000-000000000000";
          const production = config.d1_databases?.find(({ binding }) => binding === "CONTACT_RATE_LIMIT_DB");
          const preview = config.env?.preview?.d1_databases?.find(
            ({ binding }) => binding === "CONTACT_RATE_LIMIT_DB"
          );

          if (!['production', 'preview'].includes(process.env.DEPLOY_TARGET ?? '')) {
            throw new Error(`Unexpected D1 deployment target: ${process.env.DEPLOY_TARGET ?? 'missing'}.`);
          }
          for (const [environment, binding] of [['production', production], ['preview', preview]]) {
            if (!binding?.database_id || binding.database_id === placeholderId) {
              throw new Error(
                `CONTACT_RATE_LIMIT_DB for ${environment} still has the non-deployable placeholder database ID.`
              );
            }
          }
          if (production?.database_id === preview?.database_id) {
            throw new Error("Production and preview must use separate CONTACT_RATE_LIMIT_DB databases.");
          }
          NODE

          if [[ "$DEPLOY_TARGET" == "preview" ]]; then
            npx --no-install wrangler d1 migrations apply smart-portfolio-contact-rate-limit-preview --env preview --remote
          else
            npx --no-install wrangler d1 migrations apply smart-portfolio-contact-rate-limit-production --remote
          fi

      - name: Deploy the verified export and Pages Function with pinned Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ needs.verify.outputs.pages_project_name }}
          CANDIDATE_BRANCH: ${{ needs.verify.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
        run: >-
          npx --no-install wrangler pages deploy out
          --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME"
          --branch "$CANDIDATE_BRANCH"
          --commit-hash "$CANDIDATE_SHA"

      - name: Smoke test static content, integrity metadata, and both contact APIs
        env:
          CLOUDFLARE_PAGES_DOMAIN: ${{ needs.verify.outputs.pages_domain }}
          CANDIDATE_BRANCH: ${{ needs.verify.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          CONTENT_HASH: ${{ needs.verify.outputs.content_hash }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(node scripts/checkDeployedContent.mjs url "$CLOUDFLARE_PAGES_DOMAIN" "$CANDIDATE_BRANCH")"
          node scripts/checkDeployedContent.mjs smoke "$deployment_url" out "$CONTENT_HASH" "$CANDIDATE_SHA"

  heartbeat:
    name: develop-schedule-heartbeat
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: develop-schedule-heartbeat
      cancel-in-progress: false
    steps:
      - name: Check out develop for its guarded keepalive update
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh the existing develop branch after 30 inactive days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          heartbeat_path=".github/schedule-heartbeat"
          now_epoch="$(date -u +%s)"

          if ! git ls-remote --exit-code --heads origin develop > /dev/null; then
            echo "Refusing to create a keepalive branch: origin/develop must already exist."
            exit 1
          fi

          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/develop:refs/remotes/origin/develop
          main_epoch="$(git log -1 --format=%ct refs/remotes/origin/main)"
          develop_sha="$(git rev-parse refs/remotes/origin/develop)"
          develop_epoch="$(git log -1 --format=%ct refs/remotes/origin/develop)"
          latest_activity_epoch="$main_epoch"

          if (( develop_epoch > latest_activity_epoch )); then
            latest_activity_epoch="$develop_epoch"
          fi

          if (( now_epoch - latest_activity_epoch < 30 * 24 * 60 * 60 )); then
            echo "Main or develop has activity within the last 30 days."
            exit 0
          fi

          if git show-ref --verify --quiet refs/heads/develop; then
            git switch develop
            git merge --ff-only refs/remotes/origin/develop
          else
            git switch --track --create develop refs/remotes/origin/develop
          fi

          if [[ "$(git rev-parse HEAD)" != "$develop_sha" ]]; then
            echo "Refusing to prepare a keepalive from a non-current develop revision."
            exit 1
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$heartbeat_path"
          worktree_status="$(git status --porcelain=v1 --untracked-files=all)"
          unexpected=""
          while IFS= read -r status_line; do
            [[ -z "$status_line" ]] && continue
            changed_path="${status_line:3}"
            if [[ "$changed_path" != "$heartbeat_path" ]]; then
              unexpected+="$status_line"$'\n'
            fi
          done <<< "$worktree_status"

          if [[ -n "$unexpected" ]]; then
            echo "Refusing to commit unexpected heartbeat paths:"
            echo "$unexpected"
            exit 1
          fi

          git add -- "$heartbeat_path"
          staged="$(git diff --cached --name-only)"
          if [[ "$staged" != "$heartbeat_path" ]]; then
            echo "Refusing to commit a heartbeat with an unexpected staged path: $staged"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): refresh scheduled workflow heartbeat"

          if ! git merge-base --is-ancestor "$develop_sha" HEAD; then
            echo "Refusing to push a keepalive that is not a fast-forward of develop."
            exit 1
          fi

          remote_develop_sha="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          if [[ "$remote_develop_sha" != "$develop_sha" ]]; then
            echo "Refusing to update develop because it changed during the keepalive run."
            exit 1
          fi

          askpass_path="$(mktemp "$RUNNER_TEMP/smart-portfolio-heartbeat-askpass.XXXXXX")"
          cleanup_askpass() { rm -f "$askpass_path"; }
          trap cleanup_askpass EXIT
          umask 077
          cat > "$askpass_path" <<'ASKPASS'
          #!/usr/bin/env bash
          set -euo pipefail
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass_path"
          GIT_ASKPASS="$askpass_path" GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=Never \
            git -c credential.helper= push origin "HEAD:refs/heads/develop"
