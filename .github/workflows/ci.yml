name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: 17 13 * * *
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Run the green-gated deployment even when deployed content is unchanged
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve-candidate:
    name: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      obsolete: ${{ steps.candidate.outputs.obsolete }}
    steps:
      - name: Reject ineligible events and untrusted workflow references before checkout
        id: admission
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
        run: >
          set -euo pipefail

          [[ "$REPOSITORY" == "nicolasgioanni/Smart-Porfolio" ]] || { echo "Unsupported repository."; exit 1; }

          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate SHA is invalid."; exit 1; }

          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Workflow SHA is invalid."; exit 1; }

          expected_workflow_ref="$REPOSITORY/.github/workflows/ci.yml@$EVENT_REF"

          [[ "$WORKFLOW_REF" == "$expected_workflow_ref" ]] || { echo "Workflow reference does not match the eligible
          event ref."; exit 1; }

          case "$EVENT_NAME" in
            pull_request)
              [[ "$EVENT_BASE_REF" == "main" || "$EVENT_BASE_REF" == "develop" ]] || { echo "Pull requests must target main or develop."; exit 1; }
              [[ "$EVENT_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]] || { echo "Pull request candidate ref is invalid."; exit 1; }
              ;;
            push)
              [[ "$EVENT_REF" == "refs/heads/main" || "$EVENT_REF" == "refs/heads/develop" ]] || { echo "Pushes must target main or develop."; exit 1; }
              [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Trusted workflow revision does not match the candidate."; exit 1; }
              ;;
            schedule|workflow_dispatch)
              [[ "$EVENT_REF" == "refs/heads/main" ]] || { echo "Scheduled and manual candidates must use main."; exit 1; }
              [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]] || { echo "Trusted workflow revision does not match the candidate."; exit 1; }
              ;;
            *)
              echo "Unsupported CI event."
              exit 1
              ;;
          esac

          echo "candidate_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out the admitted event candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.admission.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Resolve the candidate before dependencies and protected content
        id: candidate
        run: node scripts/ci/resolve.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE_DEPLOY: ${{ toJSON(inputs.force_deploy || false) }}
  prepare-content:
    name: prepare-content
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.prepare.outputs.plan }}
      mode: ${{ steps.prepare.outputs.mode }}
      target: ${{ steps.prepare.outputs.target }}
      snapshot_reference: ${{ steps['snapshot-reference'].outputs.reference || '' }}
      discovery_reference: ${{ steps['discovery-reference'].outputs.reference || '' }}
    env:
      CI_CANDIDATE: ${{ needs['resolve-candidate'].outputs.candidate }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      CLOUDFLARE_PAGES_DOMAIN: ${{ vars.CLOUDFLARE_PAGES_DOMAIN }}
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        if: ${{ needs['resolve-candidate'].outputs.obsolete != 'true' }}
      - name: Prepare one accepted content snapshot and validated execution plan
        id: prepare
        run: node scripts/ci/run.mjs prepare
        env:
          PORTFOLIO_WORKBOOK_URL: ${{ github.event_name != 'pull_request' && needs['resolve-candidate'].outputs.obsolete != 'true'
            && secrets.PORTFOLIO_WORKBOOK_URL || '' }}
      - name: Upload immutable snapshot
        id: snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.prepare.outputs.snapshot_name }}
          path: ${{ steps.prepare.outputs.snapshot_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
        if: ${{ steps.prepare.outputs.mode != 'obsolete' }}
      - name: Record exact snapshot artifact reference
        id: snapshot-reference
        run: node scripts/ci/run.mjs reference
        env:
          CI_ARTIFACT_ROLE: snapshot
          CI_ARTIFACT_ID: ${{ steps.snapshot.outputs.artifact-id }}
          CI_ARTIFACT_DIGEST: ${{ steps.snapshot.outputs.artifact-digest }}
          CI_RECORD_DIGEST: ${{ steps.prepare.outputs.snapshot_digest }}
        if: ${{ steps.prepare.outputs.mode != 'obsolete' }}
      - name: Upload immutable discovery
        id: discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.prepare.outputs.discovery_name }}
          path: ${{ steps.prepare.outputs.discovery_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
        if: ${{ steps.prepare.outputs.mode == 'full' }}
      - name: Record exact discovery artifact reference
        id: discovery-reference
        run: node scripts/ci/run.mjs reference
        env:
          CI_ARTIFACT_ROLE: discovery
          CI_ARTIFACT_ID: ${{ steps.discovery.outputs.artifact-id }}
          CI_ARTIFACT_DIGEST: ${{ steps.discovery.outputs.artifact-digest }}
          CI_RECORD_DIGEST: ${{ steps.prepare.outputs.discovery_digest }}
        if: ${{ steps.prepare.outputs.mode == 'full' }}
  quality:
    name: quality
    needs:
      - resolve-candidate
      - prepare-content
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env: &a1
      CI_CANDIDATE: ${{ needs['resolve-candidate'].outputs.candidate }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY }}
      CI_PLAN: ${{ needs['prepare-content'].outputs.plan }}
      CI_SNAPSHOT_REFERENCE: ${{ needs['prepare-content'].outputs.snapshot_reference }}
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - &a2
        name: Install locked dependencies
        run: npm ci
      - &a3
        name: Restore and verify the accepted content snapshot
        run: node scripts/ci/run.mjs restore
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check documentation, source quality and types
        run: |-
          npm run docs:check
          npm run lint
          npm run typecheck
      - &a4
        name: Record successful validation against unchanged inputs
        id: evidence
        run: node scripts/ci/run.mjs receipt
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
  unit-integration:
    name: unit-integration
    needs:
      - resolve-candidate
      - prepare-content
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env: *a1
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - *a2
      - *a3
      - name: Run the complete isolated unit and integration suite
        run: npm test
      - *a4
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
  browser-e2e:
    name: chromium-${{ matrix.shard == '1/2' && '1' || '2' }}-of-2
    needs:
      - resolve-candidate
      - prepare-content
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env: *a1
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - *a2
      - *a3
      - name: Install required pinned browser binaries
        run: npx --no-install playwright install --with-deps chromium
      - name: Run assigned browsers and verify execution coverage
        id: evidence
        run: node scripts/ci/run.mjs browser
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DISCOVERY_REFERENCE: ${{ needs['prepare-content'].outputs.discovery_reference }}
          CI_SHARD: ${{ matrix.shard }}
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
      - name: Upload bounded browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failure-browser-e2e-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 3
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/2
          - 2/2
  visual-regression:
    name: visual-regression
    needs:
      - resolve-candidate
      - prepare-content
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env: *a1
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - *a2
      - *a3
      - name: Install required pinned browser binaries
        run: npx --no-install playwright install --with-deps chromium
      - name: Run assigned browsers and verify execution coverage
        id: evidence
        run: node scripts/ci/run.mjs browser
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DISCOVERY_REFERENCE: ${{ needs['prepare-content'].outputs.discovery_reference }}
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
      - name: Upload bounded browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failure-visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 3
  cross-browser:
    name: cross-browser
    needs:
      - resolve-candidate
      - prepare-content
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env: *a1
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - *a2
      - *a3
      - name: Install required pinned browser binaries
        run: npx --no-install playwright install --with-deps firefox webkit
      - name: Run assigned browsers and verify execution coverage
        id: evidence
        run: node scripts/ci/run.mjs browser
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DISCOVERY_REFERENCE: ${{ needs['prepare-content'].outputs.discovery_reference }}
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
      - name: Upload bounded browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failure-cross-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 3
  build-and-package:
    name: build-and-package
    needs:
      - resolve-candidate
      - prepare-content
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env: *a1
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - *a2
      - *a3
      - name: Install checksum-verified built-output scanner
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/smart-portfolio-tools"
          mkdir -p "$tool_root"
          node scripts/security/installPinnedTool.mjs gitleaks "$tool_root" > /dev/null
      - name: Build once and seal the full candidate
        id: evidence
        run: node scripts/ci/run.mjs build
        env:
          CI_GITLEAKS: ${{ runner.temp }}/smart-portfolio-tools/gitleaks/gitleaks
      - name: Upload immutable built-output scanner receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.scan_receipt_name }}
          path: ${{ steps.evidence.outputs.scan_receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
      - name: Upload immutable release
        id: release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.release_name }}
          path: ${{ steps.evidence.outputs.release_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
      - name: Record exact release artifact reference
        id: release-reference
        run: node scripts/ci/run.mjs reference
        env:
          CI_ARTIFACT_ROLE: release
          CI_ARTIFACT_ID: ${{ steps.release.outputs.artifact-id }}
          CI_ARTIFACT_DIGEST: ${{ steps.release.outputs.artifact-digest }}
          CI_RECORD_DIGEST: ${{ steps.evidence.outputs.release_digest }}
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
    outputs:
      release_reference: ${{ steps['release-reference'].outputs.reference }}
  export-check:
    name: export-check
    needs:
      - resolve-candidate
      - prepare-content
      - build-and-package
    if: ${{ needs['prepare-content'].outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      CI_CANDIDATE: ${{ needs['resolve-candidate'].outputs.candidate }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_PREVIEW_SITE_KEY }}
      CI_PLAN: ${{ needs['prepare-content'].outputs.plan }}
      CI_SNAPSHOT_REFERENCE: ${{ needs['prepare-content'].outputs.snapshot_reference }}
      CI_RELEASE_REFERENCE: ${{ needs['build-and-package'].outputs.release_reference }}
    steps:
      - name: Check out the exact candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
      - *a2
      - *a3
      - name: Install the pinned export-check browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate exact static output and compiled Pages runtime
        id: evidence
        run: node scripts/ci/run.mjs export
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
  security-tools:
    name: security-tools
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the immutable candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Install checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/smart-portfolio-tools"
          mkdir -p "$tool_root"
          node scripts/security/installPinnedTool.mjs actionlint "$tool_root" > /dev/null
      - name: Validate tracked GitHub Actions workflows without publishing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          report_root="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          if ! "$RUNNER_TEMP/smart-portfolio-tools/actionlint/actionlint" \
            -shellcheck '' \
            -pyflakes '' > "$report_root/stdout" 2> "$report_root/stderr"; then
            echo "GitHub Actions syntax validation failed without publishing diagnostics."
            exit 1
          fi
      - name: Record independent source-validation evidence
        id: evidence
        run: node scripts/ci/run.mjs source-receipt
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
    env: &a5
      CI_CANDIDATE: ${{ needs['resolve-candidate'].outputs.candidate }}
  security-scans:
    name: security-scans
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete immutable history without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Install checksum-verified credential-free scanners
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/smart-portfolio-tools"
          mkdir -p "$tool_root"
          node scripts/security/installPinnedTool.mjs gitleaks "$tool_root" > /dev/null
          node scripts/security/installPinnedTool.mjs zizmor "$tool_root" > /dev/null
      - name: Scan Git history and workflow semantics without publishing scanner details
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security/securityScans.mjs \
            --gitleaks "$RUNNER_TEMP/smart-portfolio-tools/gitleaks/gitleaks" \
            --gitleaks-mode git \
            --target . \
            --zizmor "$RUNNER_TEMP/smart-portfolio-tools/zizmor/zizmor"
      - name: Audit locked dependencies even when application content is unchanged
        run: npm run audit:check
      - name: Record independent source-validation evidence
        id: evidence
        run: node scripts/ci/run.mjs source-receipt
      - name: Upload immutable receipt
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence.outputs.receipt_name }}
          path: ${{ steps.evidence.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
    env: *a5
  infrastructure:
    name: infrastructure
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the immutable candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs['resolve-candidate'].outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
