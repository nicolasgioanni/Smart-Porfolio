name: Scheduled security scans

on:
  schedule:
    - cron: "43 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: $/.github/workflows/security-scans.yml
    permissions:
      contents: read
      security-events: write
    with:
      candidate_ref: main
      event_name: schedule
      is_fork: false
