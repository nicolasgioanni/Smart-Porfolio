version: 2.1
setup: true
parameters:
  force-full:
    type: boolean
    default: false
jobs:
  plan:
    machine:
      image: ubuntu-2404:2026.11.1
    environment:
      FORCE_FULL: << pipeline.parameters.force-full >>
      PIPELINE_TRIGGER: << pipeline.trigger.type >>
      PIPELINE_EVENT: << pipeline.event.name >>
    steps:
      - checkout
      - run:
          name: Install pinned Node
          command: |
            set -euo pipefail
            nvm install 22.23.3
            nvm use 22.23.3
            test "$(node -v)" = v22.23.3
            printf 'export PATH="%s:$PATH"\n' "$(dirname "$(command -v node)")" >> "$BASH_ENV"
      - run:
          name: Select and continue validation
          command: node scripts/circleci/setup.mjs
workflows:
  portfolio-setup:
    jobs:
      - plan
